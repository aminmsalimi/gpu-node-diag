[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-node-diag"
version = "0.1.0"
description = "NVIDIA GPU node diagnostics and troubleshooting CLI"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Mohammad Amin Salimi" }
]
dependencies = [
    "typer>=0.15",
    "rich>=13"
]

[project.scripts]
gdiag = "gpunodediag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[project.optional-dependencies]
dev = [
    "pytest>=8"
]